name: lab8_414539

on:
  push:
    branches:
      - trunk-lab8

jobs:
  run_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install dependencies
        run:  |
          pip install numpy pytest
      - name: Run unit tests
        run: |
          cd ./env_414539/main
          pytest calculator_test.py -k "test_dodawanie or test_odejmowanie or test_mnozenie or test_dzielenie"
  run_functional_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Install dependencies
        run:  |
          cd ./env_414539/main
          python -m pip install -r requirements.txt
      - name: Run Flask server
        run: |
          FLASK_APP=./env_414539/main/app.py flask run --host=127.0.0.1 --port=5000 &
          sleep 5
      - name: Run functional tests
        run: |
          cd ./env_414539/main
          pytest app_test.py -k "test_calculator_operations"
  deployment:
    name: Create image and push to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Setup
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_414539}}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{vars.DOCKERHUB_USERNAME}}/devops-lab-8

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./env_414539/dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
